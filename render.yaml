# Blueprint de Render: crea la base PostgreSQL y el servicio web con Django.
# Cómo usarlo: Render Dashboard > New > Blueprint > selecciona este repositorio.
databases:
  - name: cintac-db
    databaseName: cintac
    user: cintac
    plan: free            # IMPORTANTE: la base gratuita expira y se borra. Para uso real, cambia a un plan de pago.

services:
  - type: web
    name: cintac-cotizador
    runtime: python
    plan: free            # El plan gratuito se "duerme" tras un rato sin tráfico (la primera carga tarda).
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 2 --timeout 60"
    healthCheckPath: /salud/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cintac-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin_cintac
      - key: ADMIN_INITIAL_PASSWORD   # Defínela en el panel de Render; se te pedirá cambiarla en el primer ingreso.
        sync: false
